# ============================================================
# docker-compose.yml —— 开发环境全栈（默认文件，直接 docker compose up -d）
# 后端/前端：源码挂载 + 容器内热运行（后端改代码后 docker compose restart backend）
# 端口映射避开本机服务：MySQL 3306→13306、Redis 6379→16379、Registry 5000→15000
# ============================================================
name: dxcloud

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: dx-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dxcloud_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dxcloud}
      MYSQL_USER: ${MYSQL_USER:-dxcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dxcloud_dev_pass}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_EXPOSE_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [infra]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: dx-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dxcloud_redis_dev}
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_EXPOSE_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [infra]

  registry:
    image: ${REGISTRY_IMAGE:-registry:2.8}
    container_name: dx-registry
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      TZ: Asia/Shanghai
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "${REGISTRY_EXPOSE_PORT:-15000}:5000"
    networks: [infra]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        GO_BUILD_IMAGE: ${GO_BUILD_IMAGE:-golang:1.25-alpine}
    container_name: cloud-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dxcloud}
      MYSQL_USER: ${MYSQL_USER:-dxcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dxcloud_dev_pass}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dxcloud_redis_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-prod}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      REGISTRY_URL: ${REGISTRY_URL:-registry:5000}
      REGISTRY_ENGINE_URL: ${REGISTRY_ENGINE_URL:-host.docker.internal:15000}
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [infra, edge]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=20"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.routers.healthz.rule=PathPrefix(`/healthz`)"
      - "traefik.http.routers.healthz.entrypoints=web"
      - "traefik.http.routers.healthz.priority=20"
      - "traefik.http.routers.healthz.service=api"
      - "traefik.http.routers.ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.entrypoints=web"
      - "traefik.http.routers.ws.priority=20"
      - "traefik.http.routers.ws.service=api"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: cloud-web
    restart: unless-stopped
    environment:
      NUXT_API_PROXY_TARGET: ${NUXT_API_PROXY_TARGET:-http://cloud-api:8080}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks: [edge]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=10"
      - "traefik.http.routers.web.service=web"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3}
    container_name: cloud-proxy
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
    networks: [edge]

networks:
  edge: {}
  infra: {}

volumes:
  mysql-data: {}
  redis-data: {}
  registry-data: {}
  go-mod-cache: {}
  web-node-modules: {}
